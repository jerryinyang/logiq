services:
  postgres:
    image: postgres:16-alpine
    container_name: logiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logiq_dev}
      POSTGRES_DB: ${POSTGRES_DB:-logiq}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logiq}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: